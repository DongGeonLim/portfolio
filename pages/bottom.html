<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Magic Archive | 연출과 현상</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { 
            margin: 0; color: #ffffff; background: transparent; 
            font-family: 'Pretendard', sans-serif; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; touch-action: pan-y;
        }

        .archive-wrapper {
            width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box;
            text-align: center;
        }

        /* 영상 그리드 (1:1 비율 유지) */
        .video-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }
        .video-item {
            width: 100%; aspect-ratio: 4 / 5;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* 타이포그래피 */
        .section-tag { color: #9D4EDD; font-size: 0.75rem; font-weight: 700; letter-spacing: 4px; margin-bottom: 10px; }
        .main-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; }
        .desc-text { color: #888; font-size: 0.9rem; line-height: 1.6; word-break: keep-all; }

        @media (max-width: 480px) {
            .video-grid { gap: 10px; }
            .main-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body 
  onmousedown="parent.handleIframeStart(event, window)"
  onmousemove="parent.handleIframeMove(event, window)"
  onmouseup="parent.handleIframeEnd(event, window)"
  ontouchstart="parent.handleIframeStart(event, window)"
  ontouchmove="parent.handleIframeMove(event, window)"
  ontouchend="parent.handleIframeEnd(event, window)">

    <div class="archive-wrapper">
        <div class="section-tag">MAGIC ARCHIVE</div>
        <h1 class="main-title">연출과 현상</h1>
        
        <div class="video-grid">
            <div class="video-item">
                <video src="../media/magic1.mp4" autoplay loop muted playsinline preload="none"></video>
            </div>
            <div class="video-item">
                <video src="../media/magic2.mp4" autoplay loop muted playsinline preload="none"></video>
            </div>
        </div>

        <p class="desc-text">
            <strong>연출</strong>은 치밀하게 설계된 의도이며,<br>
            <strong>현상</strong>은 그 의도가 관객의 경험 속에서 마법처럼 실현되는 순간입니다.
        </p>
    </div>
</body>
</html>
