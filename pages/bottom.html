<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Magic Archive | 연출과 현상</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { 
            margin: 0; color: #ffffff; background: transparent; 
            font-family: 'Pretendard', sans-serif; min-height: 100vh; 
            height: auto;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow-y: auto; touch-action: pan-y;
        }

        body::-webkit-scrollbar { width: 6px; }
        body::-webkit-scrollbar-track { background: transparent; }
        body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
        body::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        .archive-wrapper {
            width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box;
            text-align: center;
        }

        /* 영상 그리드 (1:1 비율 유지) */
        .video-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }
        .video-item {
            width: 100%; aspect-ratio: 4 / 5;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* 타이포그래피 */
        .section-tag { color: #9D4EDD; font-size: 0.75rem; font-weight: 700; letter-spacing: 4px; margin-bottom: 10px; }
        .main-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; }
        .desc-text { color: #888; font-size: 0.9rem; line-height: 1.6; word-break: keep-all; }

        @media (max-width: 480px) {
            .video-grid { gap: 10px; }
            .main-title { font-size: 1.5rem; }
        }

        .project-showcase { 
            margin-top: 20px; 
            border-top: none; /* 선 제거 */
            padding-top: 20px; 
            position: relative;
        }

        /* 두 섹션 사이를 잇는 '확장' 느낌의 점 3개 표시 */
        .transition-dots {
            text-align: center; color: #555; font-size: 1.5rem; 
            margin: 30px 0; letter-spacing: 10px;
        }
            
        .vertical-grid {
            display: flex; flex-direction: column; gap: 40px; margin-top: 30px;
        }
        .vertical-item {
            width: 100%;
        }
        .aspect-16-9 {
            width: 100%; aspect-ratio: 16 / 9;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }
        .aspect-16-9 img, .aspect-16-9 video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 제목 중앙 정렬을 위한 스타일 */
        .center-text { text-align: center; }
    </style>
</head>
<body 
  onmousedown="parent.handleIframeStart(event, window)"
  onmousemove="parent.handleIframeMove(event, window)"
  onmouseup="parent.handleIframeEnd(event, window)"
  ontouchstart="parent.handleIframeStart(event, window)"
  ontouchmove="parent.handleIframeMove(event, window)"
  ontouchend="parent.handleIframeEnd(event, window)">

    <div class="archive-wrapper">
        <div class="section-tag">Visual Effect</div>
        <h1 class="main-title">시각적인 연출</h1>
        
        <div class="video-grid">
            <div class="video-item">
                <video src="../media/magic1.mp4" autoplay loop muted playsinline preload="none"></video>
            </div>
            <div class="video-item">
                <video src="../media/magic2.mp4" autoplay loop muted playsinline preload="none"></video>
            </div>
        </div>

        <p class="desc-text">
            <strong>마술</strong> 같은 연출이 정교하게 설계되었을 때,<br>
            <strong>체험자</strong>는 비현실적인 몰입의 경험을 누렸고 만족도가 높았습니다.
        </p>
    </div>

    <div class="transition-dots">···</div>

    <div class="project-showcase center-text">
        <div class="section-tag">Beyond Reality</div>
        <h1 class="main-title" style="font-size: 1.4rem;">가상 공간에서의 몰입</h1>
        
        <div class="vertical-grid">
            <div class="vertical-item">
                <div class="aspect-16-9">
                    <img src="../media/TwelveMinutes.jpg" alt="Original Inspiration">
                </div>
                <p class="desc-text"><strong>ORIGINAL:</strong> Twelve Minutes(2021, Annapurna Interactive)</p>
            </div>
            
            <div class="vertical-item">
                <div class="aspect-16-9">
                    <video src="../media/wakTop.MP4" autoplay loop muted playsinline preload="none"></video>
                </div>
                <p class="desc-text"><strong>RE-DESIGN:</strong> 시간 루프와 화재 연출</p>
            </div>
        </div>
    </div>
</body>
</html>
